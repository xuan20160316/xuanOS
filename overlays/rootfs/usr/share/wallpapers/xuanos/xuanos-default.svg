<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08162E"/>
      <stop offset="0.5" stop-color="#0E2A52"/>
      <stop offset="1" stop-color="#173F73"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2AA8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2AA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EC2FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0078D4" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="360" cy="240" r="420" fill="url(#glowBlue)" filter="url(#soft)"/>
  <circle cx="1620" cy="880" r="460" fill="url(#glowViolet)" filter="url(#soft)"/>
  <circle cx="1420" cy="180" r="260" fill="url(#glowBlue)" filter="url(#soft)"/>

  <g transform="translate(960 500)">
    <rect x="-150" y="-150" width="300" height="300" rx="66" fill="none" stroke="url(#markGrad)" stroke-width="10" opacity="0.9"/>
    <path d="M-86 -86 L86 86 M86 -86 L-86 86" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.92"/>
  </g>

  <text x="960" y="810" text-anchor="middle" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="6">xuan OS</text>
  <text x="960" y="868" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#9FC3EC" letter-spacing="8">THE FREEDOM OF LINUX, THE EASE OF WINDOWS</text>
</svg>
