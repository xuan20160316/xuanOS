# Desktop-oriented kernel tuning. Safe for laptops and desktops alike.

# Keep swapping a last resort while retaining file cache headroom.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 134217728
vm.dirty_background_bytes = 33554432

# Modern flow control + BBR for smoother wireless and long-fat links.
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_notsent_lowat = 16384

# Developer workloads: file watchers and unprivileged namespaces (Wine/Proton).
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
kernel.unprivileged_userns_clone = 1

# Hardening that does not break desktop use.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1
