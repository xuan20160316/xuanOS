#
# /etc/pacman.conf — xuan OS build-time configuration
# Only official, signed Arch repositories are used so the build is
# reproducible without trusting third-party binaries.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
Color
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Required for Wine, Steam and the 32-bit Windows compatibility layer.
[multilib]
Include = /etc/pacman.d/mirrorlist

# Community-maintained binary packages are rebuilt from source through the
# xuanos-pkg pipeline in CI; never enabled on end-user machines.
#[xuanos]
#Server = https://repo.xuanos.example/$arch
