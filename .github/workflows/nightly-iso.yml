name: Nightly ISO

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach the ISO to a pre-release on GitHub
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            archiso rsync librsvg grub fontconfig freetype2 bash \
            inter-font ttf-jetbrains-mono
          pacman-key --init
          pacman-key --populate archlinux

      - name: Align boot configs from releng
        run: |
          set +e
          RELENG=/usr/share/archiso/configs/releng
          pacman -Q archiso
          for item in syslinux grub efiboot bootstrap_packages; do
            if [ -e "$RELENG/$item" ]; then
              rm -rf "iso-profile/$item"
              cp -a "$RELENG/$item" "iso-profile/"
              echo "synced $item"
            fi
          done
          echo "== iso-profile after sync =="
          find iso-profile -maxdepth 2 | sort

      - name: Diagnose package databases
        run: |
          set +e
          echo "== active mirrorlist servers =="
          grep -vE '^\s*#|^\s*$' /etc/pacman.d/mirrorlist | head -8
          echo "== sync db files before =="
          ls -lh /var/lib/pacman/sync/ 2>/dev/null
          echo "== explicit -Sy using profile conf =="
          pacman -Sy --config iso-profile/pacman.conf
          echo "== sync db files after =="
          ls -lh /var/lib/pacman/sync/
          echo "== query problem packages =="
          for p in NetworkManager dxvk calamares lib32-openal pyside6 polkit; do
            echo "-- $p"
            pacman -Si --config iso-profile/pacman.conf "$p" 2>&1 | head -2
          done

      - name: Build ISO
        run: ./build.sh

      - name: Locate artifacts
        id: artifacts
        run: |
          iso=$(find build/out -name '*.iso' | head -n1)
          echo "iso=${iso}" >> "$GITHUB_OUTPUT"
          ls -lh build/out

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanos-nightly
          path: |
            build/out/*.iso
            build/out/SHA256SUMS.txt
          retention-days: 14

      - name: Publish nightly pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: xuan OS nightly
          files: |
            build/out/*.iso
            build/out/SHA256SUMS.txt
