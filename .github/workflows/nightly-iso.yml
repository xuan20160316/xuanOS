name: Nightly ISO

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach the ISO to a pre-release on GitHub
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          printf 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch\nServer = https://mirrors.kernel.org/archlinux/$repo/os/$arch\nServer = https://mirror.rackspace.com/archlinux/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syy --noconfirm
          pacman -S --noconfirm --needed \
            archiso rsync librsvg grub fontconfig freetype2 bash \
            inter-font ttf-jetbrains-mono
          echo "== verify package resolution =="
          pacman -Si --config iso-profile/pacman.conf networkmanager dxvk calamares pyside6 2>&1 | grep -E "^Name|^Repository"

      - name: Align boot configs from releng
        run: |
          set +e
          RELENG=/usr/share/archiso/configs/releng
          pacman -Q archiso
          for item in syslinux grub efiboot bootstrap_packages; do
            if [ -e "$RELENG/$item" ]; then
              rm -rf "iso-profile/$item"
              cp -a "$RELENG/$item" "iso-profile/"
              echo "synced $item"
            fi
          done
          echo "== iso-profile after sync =="
          find iso-profile -maxdepth 2 | sort

      - name: Build ISO
        run: ./build.sh

      - name: Locate artifacts
        id: artifacts
        run: |
          iso=$(find build/out -name '*.iso' | head -n1)
          echo "iso=${iso}" >> "$GITHUB_OUTPUT"
          ls -lh build/out

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanos-nightly
          path: |
            build/out/*.iso
            build/out/SHA256SUMS.txt
          retention-days: 14

      - name: Split ISO for GitHub release limit
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          iso=$(find build/out -name '*.iso' | head -n1)
          base=$(basename "$iso")
          split -b 1900M -d -a 2 "$iso" "build/out/${base}.part"
          (cd build/out && sha256sum "${base}".part* > "${base}.parts.sha256")
          printf 'xuan OS ISO split archive\n\nReassemble on Linux or macOS:\n\n  cat %s.part* > %s\n\nThen verify:\n\n  sha256sum -c %s.parts.sha256\n' "$base" "$base" "$base" > build/out/REASSEMBLE.txt
          ls -lh build/out

      - name: Publish nightly pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          prerelease: true
          name: xuan OS nightly ${{ github.run_number }}
          body: |
            xuan OS nightly build.

            This ISO exceeds GitHub's 2 GB per-file release limit, so it is published as split parts.
            Download every `.part` file and the checksum, then run:

                cat xuanos-*.iso.part* > xuanos.iso

            Write it to a USB drive with `dd` or use it in a virtual machine.
          files: |
            build/out/*.part*
            build/out/*.parts.sha256
            build/out/REASSEMBLE.txt
            build/out/SHA256SUMS.txt
