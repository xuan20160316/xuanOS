# Calamares settings for xuan OS
modules-search: [ local, /usr/lib/calamares/modules ]

instances: []

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - install:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - users
    - packages
    - shellprocess
    - displaymanager
    - bootloader
    - umount
  - show:
    - finished

branding: xuanos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
