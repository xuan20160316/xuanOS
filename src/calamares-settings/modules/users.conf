---
allowAutologin: true
defaultGroups:
  - wheel
  - lp
  - network
  - power
  - audio
  - video
  - storage
  - optical
  - scanner
autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: false
doAutologin: false
passwordRequirements:
  minLength: 1
  maxLength: -1
  allowWeakPasswords: true
