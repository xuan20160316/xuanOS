---
# Copies the live squashfs root onto the target filesystem.
# The source path matches the modern archiso x86_64 boot layout.
unpack:
  - source: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs
    sourcefs: squashfs
    destination: /
    exclude: /etc/machine-id
  - source: /run/archiso/bootmnt/arch/boot/
    sourcefs: unsquashfs
    destination: /tmp/Calamares-BootMount
