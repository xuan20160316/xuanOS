---
shellProcess:
  - command:
      - "rm -f /etc/sudoers.d/10-xuan-nopasswd-live"
      - "rm -f /etc/sddm.conf.d/00-xuanos-defaults.conf"
    timeout: 30
  - command:
      - "chmod 0700 /root"
    timeout: 10
  - command:
      - "systemctl enable sddm NetworkManager ufw cups bluetooth"
    timeout: 30
